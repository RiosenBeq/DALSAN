<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DALSAN İSG — Giriş</title>
  <link rel="stylesheet" href="/static/stil.css?v=3">
</head>
<body class="giris-arkaplan">
  <div class="giris-kutusu">
    <h1>DALSAN İSG</h1>
    <p class="alt-baslik">Görüntü Analiz Sistemi</p>
    {% if hata %}<p class="hata-mesaji">Şifre yanlış. Tekrar deneyin.</p>{% endif %}
    <form method="post" action="/giris">
      <input type="hidden" name="sonra" value="{{ sonra }}">
      <label>Yönetici şifresi
        <input type="password" name="sifre" autofocus required>
      </label>
      <button type="submit" class="dugme">Giriş</button>
    </form>
    <p class="not">Şifre, proje klasöründeki .env dosyasında (YONETICI_SIFRESI) yazılıdır.</p>
  </div>
</body>
</html>
