<!-- Simge sprite'ı - vendor/LISANSLAR.md.

     İKİ KAYNAK VAR, İKİSİ DE AYNI ÇİZGİ DİLİNDE:
       1. Lucide (ISC) - github.com/lucide-icons/lucide, icons/AD.svg.
          Kök etiketin İÇİ olduğu gibi bir sembole konur: kimliği "s-" ile
          başlayan bizim ad, görüntü kutusu 0 0 24 24. Renk, kalınlık ve uç
          biçimi dosyaya YAZILMAZ; kullanan taraftan (stil.css, .simge) gelir.
       2. DALSAN çizimleri - Lucide'de karşılığı olmayan öğeler (şimdilik
          yalnız yelek). Lucide kuralıyla çizilir: 24x24 ızgara, 2 birim
          çizgi, yuvarlak uç ve köşe, dolgu yok. Dosyanın sonunda, ayrı
          bölümdedir.

     YENİ SİMGE: Lucide'de varsa (1)'deki yöntemle eklenir ve aşağıdaki
     listeye yazılır; yoksa (2)'deki kuralla çizilir. Şablonda simge("ad")
     makrosuyla çağrılır; burada olmayan simge boşluk olarak çizilirdi,
     tests/test_arayuz_varliklari.py bunu yakalar.

     Kaynak listesi (bizim ad, Lucide adı). İlk 32 simge önceki turdan,
     örnekler: kamera cctv, kkd hard-hat, kural shield-alert, saglik
     activity, hoparlor speaker, hiz gauge, uyari triangle-alert, anons
     megaphone, hata circle-x, basarili circle-check.
     23.09.2026'da Lucide ana dalından eklenen 14 simge:
       insan        person-standing
       forklift     forklift
       tir          truck
       yaya-yolu    footprints
       arac-yolu    road
       park         square-parking
       yukleme      package
       yasak        ban
       siren        siren
       sessiz       volume-x
       belirsiz     circle-question-mark
       ekran        monitor
       ip-hoparlor  radio-tower
       mesafe       arrow-left-right
     Faz 2c'de (yeni bölge tipleri) eklenen 2 simge:
       gecit        route
       muaf         square-dashed

     Çizgi rengi currentColor, kalınlığı 2 birimdir; boyut ve renk
     kullanan taraftan (CSS) gelir. -->
