# Test ve lint ayarları. Paketleme yok — program uvicorn ile backend/ içinden çalışır.

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
# masaustu/dalsan_launcher.py kendi biçim düzenini korur (uzun satırlar, hizalı
# yorumlar); ruff onu yeniden biçimlendirmesin.
# dist/ ve build/ ÜRETİLEN klasörlerdir: içlerinde paketlenmiş üçüncü parti kod
# (opencv, numpy…) durur. Dışlanmazlarsa, uygulama bir kez üretildikten sonra
# `ruff check .` yüzlerce yabancı dosyayı tarar ve kullanılmaz hale gelir.
# (.gitignore'da olmaları yetmez: depo klonlanmamışsa ruff onu okuyamaz.)
exclude = ["masaustu", ".venv", "veri", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI'nin standart deyimi: parametre varsayılanında Depends/Form çağrısı
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]
